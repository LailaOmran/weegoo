<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeeGoo Games</title>
<meta name="description" content="WeeGoo Games: small, fast, satisfying games.">
<link rel="icon" href="logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="logo.webp">
<style>
  :root { --bg:#000; --card:#111; --line:#2a2a2a; --text:#f5f5f5; --muted:#9a9a9a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; text-align:center; }
  main { flex:1; width:100%; max-width:640px; margin:0 auto; padding:56px 20px 32px; }
  .logo { width:min(260px,62vw); height:auto; display:block; margin:0 auto 20px; }
  .tag { color:var(--muted); margin:0 0 48px; letter-spacing:.04em; }
  h2 { font-size:.8rem; letter-spacing:.35em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 16px; }
  .games { list-style:none; padding:0; margin:0 0 48px; display:grid; gap:12px; }
  .games li { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:16px; text-align:left; }
  .games strong { font-size:1.05rem; }
  a { color:var(--text); }
  .games a { color:var(--muted); font-size:.9rem; white-space:nowrap; }
  .contact { display:inline-block; padding:12px 26px; border:2px solid var(--text); border-radius:999px; text-decoration:none; font-weight:600; transition:background .15s,color .15s; }
  .contact:hover, .contact:focus-visible { background:var(--text); color:var(--bg); }
  .mail { color:var(--muted); font-size:.9rem; margin-top:12px; }
  footer { color:var(--muted); font-size:.85rem; padding:24px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.webp" alt="WeeGoo Games" width="1254" height="1254">
  <p class="tag">Small, fast, satisfying games.</p>

  <h2>Games</h2>
  <ul class="games">
    <li><strong>After Gomaa Praying</strong><a href="aftergomaapraying/privacy.html">Privacy Policy</a></li>
    <li><strong>Claim It Arena</strong><a href="claimitarena/privacy.html">Privacy Policy</a></li>
    <li><strong>Splash Hero</strong><a href="splashhero/privacy.html">Privacy Policy</a></li>
  </ul>

  <h2>Contact</h2>
  <a class="contact" href="mailto:lailaahmed18@outlook.com">Email us</a>
  <p class="mail">lailaahmed18@outlook.com</p>
</main>
<footer>&copy; 2026 WeeGoo Games</footer>
</body>
</html>
